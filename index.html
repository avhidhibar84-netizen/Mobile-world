<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#f8fafc" />
  <title>Mobile World | Admin Panel</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.2/dist/browser-image-compression.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    * { -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: linear-gradient(180deg, #f8fafc 0%, #eff6ff 100%);
      min-height: 100vh;
      color: #0f172a;
      margin: 0;
    }
    .toast {
      position: fixed; bottom: 1.5rem; left: 50%;
      transform: translateX(-50%) translateY(120%);
      z-index: 9999; padding: 0.75rem 1.25rem; border-radius: 9999px;
      font-size: 0.875rem; font-weight: 500;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1);
      max-width: 90vw; text-align: center;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .toast.success { background: #10b981; color: white; }
    .toast.error { background: #ef4444; color: white; }
    .drop-zone.dragover { border-color: #3b82f6 !important; background: #eff6ff !important; }
    .tab-btn.active { background: #2563eb; color: white; }
  </style>
</head>
<body class="antialiased">

  <!-- MAIN ADMIN (no login) -->
  <div id="adminApp" class="max-w-3xl mx-auto px-4 py-6">

    <header class="flex items-center justify-between mb-6">
      <div class="flex items-center gap-3">
        <img src="images/logo.png" alt="Logo" class="w-11 h-11 rounded-xl object-contain shadow-sm bg-white" onerror="this.style.display='none'" />
        <div>
          <h1 class="text-lg font-bold text-slate-900">Mobile World Admin</h1>
          <p class="text-xs text-slate-500">Products • Pre-Orders • Photos</p>
        </div>
      </div>
    </header>

    <div class="flex gap-2 mb-6 overflow-x-auto pb-1">
      <button onclick="switchTab('products')" id="tab-products" class="tab-btn active px-4 py-2 rounded-xl text-sm font-semibold bg-slate-100 text-slate-700 whitespace-nowrap">Products</button>
      <button onclick="switchTab('preorders')" id="tab-preorders" class="tab-btn px-4 py-2 rounded-xl text-sm font-semibold bg-slate-100 text-slate-700 whitespace-nowrap">Pre-Orders</button>
      <button onclick="switchTab('photos')" id="tab-photos" class="tab-btn px-4 py-2 rounded-xl text-sm font-semibold bg-slate-100 text-slate-700 whitespace-nowrap">Customer Photos</button>
    </div>

    <!-- PRODUCTS -->
    <div id="section-products">
      <section class="bg-white rounded-2xl border border-slate-200 shadow-sm p-5 mb-6">
        <h2 class="text-sm font-semibold text-slate-700 uppercase tracking-wider mb-4">Add New Product</h2>
        <form id="productForm" class="space-y-4">
          <div>
            <label class="block text-xs font-medium text-slate-600 mb-1">Product Name *</label>
            <input type="text" id="prodName" required class="w-full px-3 py-2.5 rounded-xl border border-slate-200 focus:border-blue-500 focus:outline-none text-sm" placeholder="e.g. Gold Plated Ring">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-600 mb-1">Category *</label>
            <select id="prodCategory" required class="w-full px-3 py-2.5 rounded-xl border border-slate-200 focus:border-blue-500 focus:outline-none text-sm bg-white">
              <option value="">Select category</option>
              <option value="rings">Rings</option>
              <option value="necklaces">Necklaces</option>
              <option value="earrings">Earrings</option>
              <option value="bangles">Bangles</option>
              <option value="mobile_accessories">Mobile Accessories</option>
              <option value="others">Others</option>
            </select>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-medium text-slate-600 mb-1">Original Price (₹) *</label>
              <input type="number" id="prodPrice" required min="0" step="0.01" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 focus:border-blue-500 focus:outline-none text-sm" placeholder="999">
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-600 mb-1">Discount Price (₹)</label>
              <input type="number" id="prodDiscount" min="0" step="0.01" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 focus:border-blue-500 focus:outline-none text-sm" placeholder="Optional">
            </div>
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-600 mb-1">Description</label>
            <textarea id="prodDesc" rows="3" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 focus:border-blue-500 focus:outline-none text-sm resize-none" placeholder="Product details..."></textarea>
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-600 mb-1">Product Image *</label>
            <input type="file" id="prodImage" accept="image/*" required
                   class="w-full text-sm text-slate-500 file:mr-3 file:py-2 file:px-4 file:rounded-lg file:border-0 file:bg-blue-50 file:text-blue-700 file:font-medium">
          </div>
          <button type="submit" id="prodSubmitBtn" class="w-full py-3 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-semibold transition active:scale-[0.98]">Upload Product</button>
        </form>
      </section>

      <section class="bg-white rounded-2xl border border-slate-200 shadow-sm p-5">
        <div class="flex items-center justify-between mb-4">
          <h2 class="text-sm font-semibold text-slate-700 uppercase tracking-wider">All Products</h2>
          <span id="productCount" class="text-xs font-medium text-slate-400 bg-slate-100 px-2.5 py-1 rounded-full">0</span>
        </div>
        <div id="productsList" class="space-y-3"></div>
        <div id="productsEmpty" class="text-center py-10 text-sm text-slate-400 hidden">No products yet.</div>
      </section>
    </div>

    <!-- PRE-ORDERS -->
    <div id="section-preorders" class="hidden">
      <section class="bg-white rounded-2xl border border-slate-200 shadow-sm p-5">
        <div class="flex items-center justify-between mb-3">
          <h2 class="text-sm font-semibold text-slate-700 uppercase tracking-wider">Orders (Pre-Order + Cart)</h2>
          <button onclick="loadPreOrders()" class="text-xs font-medium text-blue-600 hover:underline">Refresh</button>
        </div>

        <div class="relative mb-4">
          <svg class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input id="preOrderSearch" type="search" placeholder="Search by Name or Phone Number..."
                 class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 bg-white text-sm focus:border-blue-500 focus:outline-none" />
        </div>

        <div id="preOrdersList" class="space-y-3"></div>
        <div id="preOrdersEmpty" class="text-center py-10 text-sm text-slate-400 hidden">No orders yet.</div>
        <div id="preOrdersNoMatch" class="text-center py-10 text-sm text-slate-400 hidden">No matching orders.</div>
      </section>
    </div>

    <!-- CUSTOMER PHOTOS -->
    <div id="section-photos" class="hidden">
      <section class="bg-white rounded-2xl border border-slate-200 shadow-sm p-5 mb-6">
        <h2 class="text-sm font-semibold text-slate-700 uppercase tracking-wider mb-4">Upload Customer Photos</h2>
        <div id="dropZone" class="border-2 border-dashed border-slate-300 rounded-xl p-8 text-center cursor-pointer transition hover:border-blue-400 hover:bg-blue-50/50">
          <p class="text-sm font-medium text-slate-700">Drag & drop or click to upload</p>
          <p class="text-xs text-slate-400 mt-1">JPG, PNG, WEBP</p>
          <input id="fileInput" type="file" accept="image/*" multiple class="hidden" />
        </div>
      </section>
      <section class="bg-white rounded-2xl border border-slate-200 shadow-sm p-5">
        <div class="flex items-center justify-between mb-4">
          <h2 class="text-sm font-semibold text-slate-700 uppercase tracking-wider">Gallery</h2>
          <span id="photoCount" class="text-xs font-medium text-slate-400 bg-slate-100 px-2.5 py-1 rounded-full">0 photos</span>
        </div>
        <div id="gallery" class="grid grid-cols-2 sm:grid-cols-3 gap-3"></div>
        <div id="emptyState" class="text-center py-10 text-sm text-slate-400 hidden">No photos yet.</div>
      </section>
    </div>

    <p class="text-center text-xs text-slate-400 mt-8 pb-6">Mobile World Admin Panel</p>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    const SUPABASE_URL = 'https://bxukayuqaylnjazpscai.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_fe3TPiytqpv_wr8abcNL2Q_Re_LE1hn';
    const PHOTO_BUCKET = 'customer-photos';
    const PRODUCT_BUCKET = 'products';

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    let allPreOrders = [];

    function switchTab(tab) {
      ['products', 'preorders', 'photos'].forEach(t => {
        document.getElementById('section-' + t).classList.toggle('hidden', t !== tab);
        document.getElementById('tab-' + t).classList.toggle('active', t === tab);
      });
    }

    function showToast(msg, type = 'success') {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'toast ' + type + ' show';
      setTimeout(() => t.classList.remove('show'), 3000);
    }

    // File input reset for mobile
    const prodImageInput = document.getElementById('prodImage');
    prodImageInput.addEventListener('click', function () {
      this.value = '';
    });

    // PRODUCT UPLOAD
    document.getElementById('productForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('prodName').value.trim();
      const category = document.getElementById('prodCategory').value;
      const price = parseFloat(document.getElementById('prodPrice').value);
      const discountRaw = document.getElementById('prodDiscount').value;
      const discount_price = discountRaw ? parseFloat(discountRaw) : null;
      const description = document.getElementById('prodDesc').value.trim();
      const imageFile = document.getElementById('prodImage').files[0];

      if (!name || !category || !price || !imageFile) {
        showToast('Please fill all required fields', 'error');
        return;
      }

      const btn = document.getElementById('prodSubmitBtn');
      btn.disabled = true;
      btn.textContent = 'Compressing & Uploading...';

      try {
        const options = { maxSizeMB: 0.15, maxWidthOrHeight: 800, useWebWorker: true, fileType: 'image/webp' };
        const compressedFile = await imageCompression(imageFile, options);
        const fileName = 'product_' + Date.now() + '.webp';

        const { error: uploadError } = await supabaseClient.storage
          .from(PRODUCT_BUCKET)
          .upload(fileName, compressedFile, { cacheControl: '3600', upsert: false, contentType: 'image/webp' });
        if (uploadError) throw uploadError;

        const { data: urlData } = supabaseClient.storage.from(PRODUCT_BUCKET).getPublicUrl(fileName);
        const image_url = urlData.publicUrl;

        const { error: insertError } = await supabaseClient.from('products').insert({
          name, category, price, discount_price, description, image_url,
          in_stock: true, status: 'available'
        });
        if (insertError) throw insertError;

        showToast('Product uploaded successfully!');
        document.getElementById('productForm').reset();
        prodImageInput.value = '';
        loadProducts();
      } catch (err) {
        console.error(err);
        showToast('Upload failed: ' + (err.message || 'Unknown error'), 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Upload Product';
      }
    });

    async function loadProducts() {
      const list = document.getElementById('productsList');
      const empty = document.getElementById('productsEmpty');
      const count = document.getElementById('productCount');
      list.innerHTML = '<p class="text-sm text-slate-400 text-center py-6">Loading...</p>';

      const { data, error } = await supabaseClient
        .from('products')
        .select('*')
        .order('created_at', { ascending: false });

      if (error || !data) {
        list.innerHTML = '';
        empty.classList.remove('hidden');
        count.textContent = '0';
        return;
      }

      count.textContent = data.length;
      if (!data.length) {
        list.innerHTML = '';
        empty.classList.remove('hidden');
        return;
      }

      empty.classList.add('hidden');
      list.innerHTML = data.map(p => {
        const safeUrl = (p.image_url || '').replace(/'/g, "\\'");
        const statusBadge = p.status === 'reserved'
          ? '<span class="text-[10px] font-medium px-1.5 py-0.5 rounded-full bg-amber-100 text-amber-700">Reserved</span>'
          : p.status === 'sold'
          ? '<span class="text-[10px] font-medium px-1.5 py-0.5 rounded-full bg-slate-200 text-slate-600">Sold</span>'
          : '<span class="text-[10px] font-medium px-1.5 py-0.5 rounded-full bg-emerald-100 text-emerald-700">Available</span>';
        return `
        <div class="flex gap-3 items-center p-3 rounded-xl border border-slate-100 bg-slate-50">
          <img src="${p.image_url}" class="w-14 h-14 rounded-lg object-cover bg-white border" onerror="this.style.opacity='0.3'">
          <div class="flex-1 min-w-0">
            <p class="font-semibold text-sm text-slate-900 truncate">${p.name}</p>
            <p class="text-xs text-slate-500 capitalize">${(p.category||'').replace('_',' ')}</p>
            <p class="text-sm font-medium text-blue-600 mt-0.5">
              ${p.discount_price ? `<span class="line-through text-slate-400 mr-1">₹${p.price}</span>₹${p.discount_price}` : '₹' + p.price}
            </p>
            <div class="mt-1">${statusBadge}</div>
          </div>
          <button onclick="deleteProduct('${p.id}', '${safeUrl}')" class="text-xs text-red-500 hover:bg-red-50 px-2 py-1 rounded-lg font-medium">Delete</button>
        </div>`;
      }).join('');
    }

    async function deleteProduct(productId, imageUrl) {
      if (!confirm('Are you sure you want to delete this product?')) return;
      try {
        if (imageUrl && typeof imageUrl === 'string' && imageUrl.trim()) {
          try {
            const decodedUrl = decodeURIComponent(imageUrl);
            const marker = '/products/';
            const idx = decodedUrl.indexOf(marker);
            if (idx !== -1) {
              let filePath = decodedUrl.substring(idx + marker.length).split('?')[0].split('#')[0];
              if (filePath) await supabaseClient.storage.from(PRODUCT_BUCKET).remove([filePath]);
            }
          } catch (err) {
            console.warn('Image path parsing failed:', err.message);
          }
        }
        const { error: dbError } = await supabaseClient.from('products').delete().eq('id', productId);
        if (dbError) throw dbError;
        showToast('Product and image deleted successfully!');
        loadProducts();
      } catch (error) {
        console.error('Delete failed:', error.message);
        showToast('Delete failed: ' + (error.message || 'Unknown error'), 'error');
      }
    }

    // ========== ORDERS (Pre-Order + Cart) ==========
    async function loadPreOrders() {
      const list = document.getElementById('preOrdersList');
      const empty = document.getElementById('preOrdersEmpty');
      const noMatch = document.getElementById('preOrdersNoMatch');
      list.innerHTML = '<p class="text-sm text-slate-400 text-center py-6">Loading...</p>';
      empty.classList.add('hidden');
      noMatch.classList.add('hidden');

      const { data, error } = await supabaseClient
        .from('pre_orders')
        .select('*')
        .order('created_at', { ascending: false });

      if (error || !data) {
        list.innerHTML = '';
        empty.classList.remove('hidden');
        allPreOrders = [];
        return;
      }

      allPreOrders = data;
      if (!data.length) {
        list.innerHTML = '';
        empty.classList.remove('hidden');
        return;
      }
      renderPreOrderRows(data);
    }

    function getProductIdsFromOrder(o) {
      const ids = new Set();
      if (o.product_id && o.product_id !== 'null' && o.product_id !== 'undefined') {
        ids.add(String(o.product_id));
      }
      if (o.items && Array.isArray(o.items)) {
        o.items.forEach(item => {
          if (item && item.product_id) ids.add(String(item.product_id));
        });
      }
      if (o.cart_items && Array.isArray(o.cart_items)) {
        o.cart_items.forEach(item => {
          if (item && item.product_id) ids.add(String(item.product_id));
        });
      }
      return Array.from(ids);
    }

    function renderPreOrderRows(orders) {
      const list = document.getElementById('preOrdersList');
      const empty = document.getElementById('preOrdersEmpty');
      const noMatch = document.getElementById('preOrdersNoMatch');
      empty.classList.add('hidden');
      noMatch.classList.add('hidden');

      if (!orders.length) {
        list.innerHTML = '';
        if (allPreOrders.length === 0) empty.classList.remove('hidden');
        else noMatch.classList.remove('hidden');
        return;
      }

      list.innerHTML = orders.map(o => {
        const date = new Date(o.created_at).toLocaleString('en-IN', {
          day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit'
        });
        const phone = String(o.phone_number || o.customer_phone || '').replace(/\D/g, '');
        const waPhone = phone.startsWith('91') ? phone : '91' + phone;
        const ip = o.user_ip || 'N/A';
        const status = o.status || 'pending';
        const orderType = (o.order_type || 'preorder').toLowerCase();
        const isCart = orderType === 'cart';

        // Order type badge
        const typeBadge = isCart
          ? '<span class="inline-block text-[10px] font-semibold px-2 py-0.5 rounded-full bg-indigo-100 text-indigo-700">Cart</span>'
          : '<span class="inline-block text-[10px] font-semibold px-2 py-0.5 rounded-full bg-purple-100 text-purple-700">Pre-Order</span>';

        const statusClass =
          status === 'pending' || status === 'Pending' ? 'bg-amber-100 text-amber-700' :
          status === 'completed' || status === 'Completed' ? 'bg-emerald-100 text-emerald-700' :
          'bg-slate-100 text-slate-600';

        // ===== DYNAMIC DISCOUNT BREAKDOWN =====
        const subtotal = Number(o.subtotal) || 0;
        const discountAmount = Number(o.discount_amount) || 0;
        const finalPrice = Number(o.final_price) || 0;
        let discountPercent = 0;
        if (subtotal > 0 && discountAmount > 0) {
          discountPercent = Math.round((discountAmount / subtotal) * 100);
        }

        let priceBreakdownHtml = '';
        if (subtotal > 0 || finalPrice > 0) {
          priceBreakdownHtml = `
            <div class="mt-2 p-2.5 rounded-lg bg-white border border-slate-200 text-xs space-y-1">
              <div class="flex justify-between text-slate-600">
                <span>Original Subtotal</span>
                <span>₹${subtotal || '—'}</span>
              </div>
              ${discountPercent > 0 ? `
                <div class="flex justify-between items-center text-emerald-600 font-medium">
                  <span>Discount Applied</span>
                  <span class="inline-flex items-center gap-1">
                    <span class="text-[10px] font-bold px-1.5 py-0.5 rounded-full bg-emerald-100 text-emerald-700">${discountPercent}% OFF</span>
                    -₹${discountAmount}
                  </span>
                </div>
              ` : ''}
              <div class="flex justify-between font-bold text-slate-900 pt-1 border-t border-slate-100">
                <span>Final Payable</span>
                <span>₹${finalPrice || subtotal || '—'}</span>
              </div>
            </div>
          `;
        }

        // Cart items list
        let itemsHtml = '';
        const cartItems = (o.items && Array.isArray(o.items)) ? o.items :
                          (o.cart_items && Array.isArray(o.cart_items)) ? o.cart_items : null;

        if (isCart && cartItems && cartItems.length) {
          itemsHtml = `
            <div class="mt-2 p-2.5 rounded-lg bg-white border border-slate-200">
              <p class="text-[11px] font-semibold text-slate-500 uppercase mb-1.5">Cart Items (${cartItems.length})</p>
              <div class="space-y-1">
                ${cartItems.map(item => `
                  <div class="flex justify-between items-center text-xs">
                    <span class="text-slate-700 truncate pr-2">${item.product_name || item.name || '—'}</span>
                    <span class="font-medium text-blue-600 whitespace-nowrap">
                      ${item.original_price ? `<span class="line-through text-slate-400 mr-1">₹${item.original_price}</span>` : ''}
                      ₹${item.price || '—'}
                    </span>
                  </div>
                `).join('')}
              </div>
            </div>
          `;
        }

        const allProductIds = getProductIdsFromOrder(o);
        const productIdsStr = allProductIds.join(',');

        return `
          <div class="preorder-row p-4 rounded-xl border border-slate-100 bg-slate-50">
            <div class="flex flex-col gap-2">
              <div class="min-w-0">
                <div class="flex items-center gap-2 flex-wrap">
                  <p class="font-semibold text-sm text-slate-900">${o.customer_name || '—'}</p>
                  ${typeBadge}
                </div>
                <p class="text-xs text-slate-500 mt-0.5">${o.product_name || '—'}</p>
                ${itemsHtml}
                ${priceBreakdownHtml}
                <p class="text-xs text-slate-500 mt-1.5">📞 ${phone || '—'}</p>
                <p class="text-xs text-slate-400 mt-1">${date}</p>
                <p class="text-[11px] text-slate-400 mt-0.5">IP: ${ip}</p>
                <span class="inline-block mt-2 text-[11px] font-medium px-2 py-0.5 rounded-full ${statusClass}">${status}</span>
              </div>
              <div class="flex flex-wrap gap-2 mt-1">
                <a href="https://wa.me/${waPhone}" target="_blank" rel="noopener noreferrer"
                   class="inline-flex items-center gap-1 px-3 py-1.5 rounded-lg bg-emerald-500 hover:bg-emerald-600 text-white text-xs font-semibold transition">WhatsApp</a>
                <a href="tel:+${waPhone}"
                   class="inline-flex items-center px-3 py-1.5 rounded-lg bg-blue-500 hover:bg-blue-600 text-white text-xs font-semibold transition">Call</a>
                <button onclick="markComplete('${o.id}', '${productIdsStr}')"
                        class="inline-flex items-center px-3 py-1.5 rounded-lg bg-green-600 hover:bg-green-700 text-white text-xs font-semibold transition">Mark Complete</button>
                <button onclick="cancelPreOrder('${o.id}', '${productIdsStr}')"
                        class="inline-flex items-center px-3 py-1.5 rounded-lg bg-orange-500 hover:bg-orange-600 text-white text-xs font-semibold transition">Cancel Order</button>
                <button onclick="markAsSpam('${ip}')"
                        class="inline-flex items-center px-3 py-1.5 rounded-lg bg-red-500 hover:bg-red-600 text-white text-xs font-semibold transition">Mark as Spam</button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    document.getElementById('preOrderSearch').addEventListener('input', (e) => {
      const q = e.target.value.trim().toLowerCase();
      if (!q) { renderPreOrderRows(allPreOrders); return; }
      const filtered = allPreOrders.filter(o => {
        const name = (o.customer_name || '').toLowerCase();
        const phone = String(o.phone_number || o.customer_phone || '').replace(/\D/g, '');
        return name.includes(q) || phone.includes(q);
      });
      renderPreOrderRows(filtered);
    });

    async function markComplete(orderId, productIdsStr) {
      if (!confirm('Mark this order as completed?\n\nAll related product(s) will be marked as Sold and the order will be removed from the list.')) return;
      try {
        const ids = (productIdsStr || '').split(',').map(s => s.trim()).filter(id => id && id !== 'null' && id !== 'undefined');
        if (ids.length > 0) {
          await supabaseClient.from('products').update({ status: 'sold' }).in('id', ids);
        }
        const { error: delError } = await supabaseClient.from('pre_orders').delete().eq('id', orderId);
        if (delError) throw delError;
        showToast('Order marked as completed. Product(s) set to Sold.');
        loadPreOrders();
        loadProducts();
      } catch (err) {
        console.error(err);
        showToast('Mark complete failed: ' + (err.message || 'Unknown error'), 'error');
      }
    }

    async function cancelPreOrder(orderId, productIdsStr) {
      if (!confirm('Cancel this order?\n\nAll related product(s) will be made available again on the storefront.')) return;
      try {
        const ids = (productIdsStr || '').split(',').map(s => s.trim()).filter(id => id && id !== 'null' && id !== 'undefined');
        if (ids.length > 0) {
          await supabaseClient.from('products').update({ status: 'available' }).in('id', ids);
        }
        const { error: delError } = await supabaseClient.from('pre_orders').delete().eq('id', orderId);
        if (delError) throw delError;
        showToast('Order cancelled. Product(s) restored to Available on storefront.');
        loadPreOrders();
        loadProducts();
      } catch (err) {
        console.error(err);
        showToast('Cancel failed: ' + (err.message || 'Unknown error'), 'error');
      }
    }

    async function markAsSpam(userIp) {
      if (!userIp || userIp === 'N/A' || userIp === 'unknown') {
        showToast('No valid IP to blacklist', 'error');
        return;
      }
      if (!confirm('Mark IP ' + userIp + ' as spam?\n\nThis will:\n• Blacklist the IP\n• Delete ALL orders from this IP\n• Restore reserved products to Available')) return;
      try {
        await supabaseClient.from('blacklisted_ips').upsert({ ip_address: userIp }, { onConflict: 'ip_address' });

        const { data: orders } = await supabaseClient
          .from('pre_orders')
          .select('*')
          .eq('user_ip', userIp);

        const productIds = new Set();
        (orders || []).forEach(o => {
          getProductIdsFromOrder(o).forEach(id => productIds.add(id));
        });

        if (productIds.size > 0) {
          await supabaseClient.from('products').update({ status: 'available' }).in('id', Array.from(productIds));
        }

        const { error: delError } = await supabaseClient.from('pre_orders').delete().eq('user_ip', userIp);
        if (delError) throw delError;

        showToast('IP ' + userIp + ' blacklisted. Products restored to storefront.');
        loadPreOrders();
        loadProducts();
      } catch (err) {
        console.error(err);
        showToast('Spam action failed: ' + (err.message || 'Unknown error'), 'error');
      }
    }

    // CUSTOMER PHOTOS
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    dropZone.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', e => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      if (e.dataTransfer.files.length) handlePhotoFiles(e.dataTransfer.files);
    });
    fileInput.addEventListener('change', () => {
      if (fileInput.files.length) handlePhotoFiles(fileInput.files);
    });

    async function handlePhotoFiles(files) {
      const images = Array.from(files).filter(f => f.type.startsWith('image/'));
      if (!images.length) return showToast('Select image files only', 'error');
      let done = 0;
      for (const file of images) {
        const ext = file.name.split('.').pop().toLowerCase();
        const name = 'customer_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7) + '.' + ext;
        const { error } = await supabaseClient.storage.from(PHOTO_BUCKET).upload(name, file);
        if (!error) done++;
      }
      showToast(done + ' photo(s) uploaded');
      fileInput.value = '';
      loadGallery();
    }

    async function loadGallery() {
      const gallery = document.getElementById('gallery');
      const empty = document.getElementById('emptyState');
      const count = document.getElementById('photoCount');
      const { data } = await supabaseClient.storage.from(PHOTO_BUCKET).list('', {
        limit: 100, sortBy: { column: 'created_at', order: 'desc' }
      });
      const images = (data || []).filter(f => f.name && /\.(jpe?g|png|webp|gif)$/i.test(f.name));
      count.textContent = images.length + ' photos';
      if (!images.length) {
        gallery.innerHTML = '';
        empty.classList.remove('hidden');
        return;
      }
      empty.classList.add('hidden');
      gallery.innerHTML = images.map(f => {
        const url = SUPABASE_URL + '/storage/v1/object/public/' + PHOTO_BUCKET + '/' + f.name;
        return `
          <div class="relative group rounded-xl overflow-hidden bg-slate-100 border">
            <img src="${url}" class="w-full aspect-square object-cover" loading="lazy">
            <button data-name="${f.name}" class="delete-photo absolute top-2 right-2 w-8 h-8 rounded-full bg-red-500 text-white flex items-center justify-center shadow text-lg leading-none">×</button>
          </div>`;
      }).join('');
      document.querySelectorAll('.delete-photo').forEach(btn => {
        btn.addEventListener('click', async () => {
          if (!confirm('Delete this photo?')) return;
          await supabaseClient.storage.from(PHOTO_BUCKET).remove([btn.dataset.name]);
          showToast('Photo deleted');
          loadGallery();
        });
      });
    }

    // Load everything on page open
    loadProducts();
    loadPreOrders();
    loadGallery();
  </script>
</body>
</html>
